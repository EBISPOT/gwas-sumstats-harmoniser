name: Deploy Documentation

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/gwas-sumstats-harmoniser-docs/package-lock.json

      - name: Install dependencies
        working-directory: docs/gwas-sumstats-harmoniser-docs
        run: npm ci

      - name: Build site
        working-directory: docs/gwas-sumstats-harmoniser-docs
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/gwas-sumstats-harmoniser-docs/build
